<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1187px;height:345px;background:#FFFFFF;" width="1187px" height="345px" viewBox="0 0 1187 345" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="397.195" font-weight="700">CTS ACADEMY — PANEL DE POSTULACIÓN DEL CANDIDATO</text><line x1="6" y1="24.469" x2="846.764" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="846.764" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="73.617" font-weight="700">Candidato:</text><text x="83.432" y="41.107" fill="#000" font-size="12" textLength="150.387">Juan Carlos Pérez Gómez</text><text x="847.764" y="41.107" fill="#000" font-size="12" textLength="80.725" font-weight="700">Expediente:</text><text x="932.303" y="41.107" fill="#000" font-size="12" textLength="116.736">CTS-2026-BOG-042</text><rect x="1053.539" y="32.469" width="124" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="1074.907" y="45.607" fill="#000" font-size="12" textLength="81.264">Cerrar Sesión</text><line x1="6" y1="58.438" x2="846.764" y2="58.438" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="75.076" fill="#000" font-size="12" textLength="140.127" font-weight="700">Convocatoria Activa:</text><text x="149.127" y="75.076" fill="#000" font-size="12" textLength="258.029">Becas Talento Internacional — Ciclo 2026-I</text><text x="7" y="91.045" fill="#000" font-size="12" textLength="132.152" font-weight="700">Sede Internacional:</text><text x="149.127" y="91.045" fill="#000" font-size="12" textLength="145.975">Sede Bogotá (Colombia)</text><text x="7" y="107.014" fill="#000" font-size="12" textLength="138.504" font-weight="700">Fecha Límite Global:</text><text x="149.127" y="107.014" fill="#000" font-size="12" textLength="255.451">15 de Noviembre de 2026 a las 23:59 UTC</text><text x="7" y="122.982" fill="#000" font-size="12" textLength="140.121" font-weight="700">Progreso de Batería:</text><text x="149.127" y="122.982" fill="#000" font-size="12" textLength="304.266" font-weight="700">2 de 3 tests diagnósticos completados (67%)</text><line x1="6" y1="132.313" x2="846.764" y2="132.313" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="147.951" fill="#000" font-size="12" textLength="311.566" font-weight="700">BATERÍA DE TESTS DIAGNÓSTICOS (ADR-007):</text><text x="6" y="163.92" fill="#000" font-size="12" textLength="675.094" font-style="italic">Puede rendir los tests pendientes en el orden que prefiera. Dispone de un único intento ininterrumpido por test.</text><line x1="6" y1="172.25" x2="846.764" y2="172.25" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="188.889" fill="#000" font-size="12" textLength="113.279" font-weight="700">Test Diagnóstico</text><text x="219.99" y="188.889" fill="#000" font-size="12" textLength="97.049" font-weight="700">Duración Máx.</text><text x="319.039" y="188.889" fill="#000" font-size="12" textLength="68.959" font-weight="700">Contenido</text><text x="536.207" y="188.889" fill="#000" font-size="12" textLength="93.076" font-weight="700">Estado Actual</text><text x="705.428" y="188.889" fill="#000" font-size="12" textLength="44.414" font-weight="700">Acción</text><line x1="7" y1="197.219" x2="218.99" y2="197.219" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="212.857" fill="#000" font-size="12" textLength="120.492" font-weight="700">1. Test de Actitud</text><text x="219.99" y="212.857" fill="#000" font-size="12" textLength="67.617">20 minutos</text><text x="319.039" y="212.857" fill="#000" font-size="12" textLength="190.078">Escala Likert (Perfil conductual)</text><text x="536.207" y="212.857" fill="#008000" font-size="12" textLength="81.064" font-weight="700">Completado</text><text x="621.086" y="212.857" fill="#000" font-size="12" textLength="82.342">(18/10 10:14)</text><rect x="707.928" y="204.219" width="132" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="728.116" y="217.357" fill="#000" font-size="12" textLength="91.623">Test Entregado</text><text x="7" y="237.826" fill="#000" font-size="12" textLength="121.969" font-weight="700">2. Test de Aptitud</text><text x="219.99" y="237.826" fill="#000" font-size="12" textLength="67.617">30 minutos</text><text x="319.039" y="237.826" fill="#000" font-size="12" textLength="215.168">Razonamiento lógico y psicotécnico</text><text x="536.207" y="237.826" fill="#008000" font-size="12" textLength="81.064" font-weight="700">Completado</text><text x="621.086" y="237.826" fill="#000" font-size="12" textLength="82.342">(19/10 16:45)</text><rect x="707.928" y="229.188" width="132" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="728.116" y="242.326" fill="#000" font-size="12" textLength="91.623">Test Entregado</text><text x="7" y="262.795" fill="#000" font-size="12" textLength="210.99" font-weight="700">3. Test Técnico Multidisciplinar</text><text x="219.99" y="262.795" fill="#000" font-size="12" textLength="67.617">60 minutos</text><text x="319.039" y="262.795" fill="#000" font-size="12" textLength="189.211">15 teóricas + 2 retos de código</text><text x="536.207" y="262.795" fill="#FFA500" font-size="12" textLength="68.736" font-weight="700">Pendiente</text><text x="608.758" y="262.795" fill="#000" font-size="12" textLength="68.227">(Sin iniciar)</text><text x="705.428" y="262.795" fill="#000" font-size="12" textLength="139.336" font-weight="700">[ Iniciar Test Ahora ]</text><line x1="6" y1="272.125" x2="846.764" y2="272.125" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="287.764" fill="#00F" font-size="12" textLength="351.176" font-weight="700">INFORMACIÓN INSTITUCIONAL PARA EL ASPIRANTE:</text><e