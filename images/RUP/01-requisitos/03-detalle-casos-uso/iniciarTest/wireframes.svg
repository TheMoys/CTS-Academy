<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:902px;height:229px;background:#FFFFFF;" width="902px" height="229px" viewBox="0 0 902 229" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="350.719" font-weight="700">CTS ACADEMY — CONFIRMACIÓN DE INICIO DE TEST</text><line x1="6" y1="24.469" x2="629.436" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="629.436" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="170.807" font-weight="700">Evaluación Seleccionada:</text><text x="180.621" y="41.107" fill="#000" font-size="12" textLength="246.434">Test Técnico de Admisión (CTS-TECH-01)</text><line x1="6" y1="49.438" x2="629.436" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="66.076" fill="#000" font-size="12" textLength="88.219" font-weight="700">Tipo de Test:</text><text x="130.26" y="66.076" fill="#000" font-size="12" textLength="335.326">Test Técnico Multidisciplinar (Módulos de los 6 Equipos)</text><text x="7" y="82.045" fill="#000" font-size="12" textLength="111.762" font-weight="700">Duración Límite:</text><text x="130.26" y="82.045" fill="#000" font-size="12" textLength="279.914">60 minutos (Cronómetro continuo en servidor)</text><text x="7" y="98.014" fill="#000" font-size="12" textLength="121.26" font-weight="700">Número de Ítems:</text><text x="130.26" y="98.014" fill="#000" font-size="12" textLength="370.881">15 preguntas teóricas objetivas + 2 retos prácticos de código</text><text x="7" y="113.982" fill="#000" font-size="12" textLength="68.473" font-weight="700">Indicador:</text><text x="130.26" y="113.982" fill="#000" font-size="12" textLength="254.373">Nivel de afinidad competencial por equipo</text><line x1="6" y1="123.313" x2="629.436" y2="123.313" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="138.951" fill="#F00" font-size="12" textLength="166.746" font-weight="700">ATENCIÓN IMPORTANTE:</text><ellipse cx="11.5" cy="150.25" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="154.92" fill="#000" font-size="12" textLength="247.189">El cronómetro se ejecuta en el servidor y</text><text x="269.004" y="154.92" fill="#000" font-size="12" textLength="91.822" font-weight="700">no se detiene</text><text x="364.641" y="154.92" fill="#000" font-size="12" textLength="254.742">si recarga la página o cierra el navegador.</text><ellipse cx="11.5" cy="166.219" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="170.889" fill="#000" font-size="12" textLength="610.436">Al expirar el tiempo límite, el test se autoentregará con las respuestas guardadas hasta ese instante.</text><ellipse cx="11.5" cy="182.188" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="186.857" fill="#000" font-size="12" textLength="373.225">Dispone de un único intento para rendir este test diagnóstico.</text><line x1="6" y1="195.188" x2="629.436" y2="195.188" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="202.188" width="164" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="37.78" y="215.326" fill="#000" font-size="12" textLength="105.439">Iniciar Test Ahora</text><rect x="632.936" y="202.188" width="260" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="672.502" y="215.326" fill="#000" font-size="12" textLength="180.867">Volver al Panel de Postulación</text><?plantuml-src NLDDRzD04BtdLyon1P9-22g1GbNBCS8ISQlMGa9L3vlrr9rglMjsrm54A_47EC4Vw943fznwzJ_Xbp2xJgI0BnuvC--zUMzouhomtWdbuHDPlBQYGJVwEW9-felZjBo094rcsVm3_Fds4zBJuar-Fa_IlFzHm2o3lCZJ_3HKPNPHJlSMnt7qDJyRZ6mfL2SazIiD5wXGIZ9QLE9Lw8OIdOUo_oKrIGCLGb8rv6Bp3hEFoonzEzu_s8reut5y3VBMy2MrSIu03P3nkViFUTufJnKvIQqYBIpipFjLrIdZmd1u7K7siMCmjxiDF-liMlkx_dT37jSSTt2q3mtfplFeJcgDxbSDUcj06ktvkm