e="12" font-weight="700">1</text><text x="433.564" y="187.889" fill="#000" font-size="12" textLength="112.271" font-weight="700">94% completado</text><line x1="6" y1="197.219" x2="645.719" y2="197.219" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="212.857" fill="#F00" font-size="12" textLength="323.215" font-weight="700">ATENCIÓN IMPORTANTE ANTES DE CONFIRMAR:</text><ellipse cx="11.5" cy="224.156" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="228.826" fill="#000" font-size="12" textLength="67.588">Dispone de</text><text x="89.402" y="228.826" fill="#000" font-size="12" textLength="223.6" font-weight="700">1 pregunta teórica sin responder</text><text x="316.816" y="228.826" fill="#000" font-size="12" textLength="86.701">(Pregunta 12).</text><ellipse cx="11.5" cy="240.125" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="244.795" fill="#000" font-size="12" textLength="591.029">Al confirmar la entrega, se congelarán de inmediato todas las respuestas y el código del sandbox.</text><ellipse cx="11.5" cy="256.094" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="260.764" fill="#000" font-size="12" textLength="505.301">No podrá volver a ingresar ni modificar ningún dato de esta evaluación diagnóstica.</text><ellipse cx="11.5" cy="272.063" rx="2.5" ry="2.5" fill="#000"/><text x="18" y="276.732" fill="#000" font-size="12" textLength="626.719">Conforme a la política institucional (ADR-007), los resultados serán procesados por el equipo evaluador.</text><line x1="6" y1="285.063" x2="645.719" y2="285.063" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="292.063" width="220" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="43.521" y="305.201" fill="#000" font-size="12" textLength="149.959">Cancelar y Volver al Test</text><text x="646.719" y="300.701" fill="#000" font-size="12" textLength="309.105" font-weight="700">[ Confirmar y Entregar Evaluación Definitiva ]</text><?plantuml-src TLN1JXin4BtdA-PIAQa891454T68PREbgI2WP46g40TdTx9oj