<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1013px;height:336px;background:#FFFFFF;" width="1013px" height="336px" viewBox="0 0 1013 336" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="331.254" font-weight="700">CTS ACADEMY — VISOR DE MATERIAL DIDÁCTICO</text><line x1="6" y1="24.469" x2="603.49" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="603.49" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="54.475" font-weight="700">Módulo:</text><text x="64.289" y="41.107" fill="#000" font-size="12" textLength="249.322">M02 - Microservicios &amp; Arquitectura REST</text><text x="604.49" y="41.107" fill="#000" font-size="12" textLength="60.955" font-weight="700">Material:</text><text x="669.26" y="41.107" fill="#000" font-size="12" textLength="336.984">Guía 02: Autenticación JWT y Manejo de Refresh Tokens</text><line x1="6" y1="49.438" x2="603.49" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="66.076" fill="#000" font-size="12" textLength="33.932" font-weight="700">Tipo:</text><text x="44.746" y="66.076" fill="#000" font-size="12" textLength="151.248">Guía Técnica / Markdown</text><text x="212.66" y="66.076" fill="#000" font-size="12" textLength="42.527" font-weight="700">Autor:</text><text x="259.002" y="66.076" fill="#000" font-size="12" textLength="147.68">Tech Leader Diego Moys</text><text x="408.682" y="66.076" fill="#000" font-size="12" textLength="121.377" font-weight="700">Tiempo Estimado:</text><text x="533.873" y="66.076" fill="#000" font-size="12" textLength="67.617">25 minutos</text><text x="7" y="82.045" fill="#000" font-size="12" textLength="127.084" font-weight="700">Estado de Lectura:</text><text x="134.084" y="82.045" fill="#000" font-size="12"> </text><text x="137.898" y="82.045" fill="#008000" font-size="12" textLength="72.762">Completado</text><line x1="6" y1="91.375" x2="603.49" y2="91.375" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="107.014" fill="#000" font-size="12" textLength="261.451" font-weight="700">CONTENIDO DIDÁCTICO DEL RECURSO:</text><line x1="7" y1="115.344" x2="577.086" y2="115.344" style="stroke:#AAA;stroke-width:1;"/><line x1="7" y1="117.344" x2="577.086" y2="117.344" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="131.982" fill="#000" font-size="12" textLength="569.086">Un JSON Web Token (JWT) es un estándar abierto que define una forma compacta y autónoma</text><text x="7" y="147.951" fill="#000" font-size="12" textLength="489.158">de transmitir información de forma segura entre las partes como un objeto JSON.</text><line x1="7" y1="155.281" x2="577.086" y2="155.281" style="stroke:#AAA;stroke-width:1;"/><line x1="7" y1="157.281" x2="577.086" y2="157.281" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="171.92" fill="#000" font-size="12" textLength="553.107">Un token está compuesto por tres partes separadas por puntos (header.payload.signature):</text><ellipse cx="12.5" cy="183.219" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="187.889" fill="#000" font-size="12" textLength="389.045">Header: Tipo de token y algoritmo de firma (ej. RS256 o HS256).</text><ellipse cx="12.5" cy="199.188" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="203.857" fill="#000" font-size="12" textLength="367.588">Payload: Claims con la identidad del usuario y roles técnicos.</text><ellipse cx="12.5" cy="215.156" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="219.826" fill="#000" font-size="12" textLength="351.967">Signature: Cifrado con clave secreta o par asimétrico RSA.</text><line x1="7" y1="227.156" x2="577.086" y2="227.156" style="stroke:#AAA;stroke-width:1;"/><line x1="7" y1="229.156" x2="577.086" y2="229.156" style="stroke:#AAA;stroke-width:1;"/><ellipse cx="12.5" cy="239.125" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="243.795" fill="#000" font-size="12" textLength="544.061">Access Token en memoria / encabezado Authorization Bearer con vigencia de 15 minutos.</text><ellipse cx="12.5" cy="255.094" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="259.764" fill="#000" font-size="12" textLength="474.381">Refresh Token en Cookie HttpOnly con rotación estricta y revocación en Redis.</text><line x1="6" y1="269.094" x2="603.49" y2="269.094" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="276.094" width="188" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="32.967" y="289.232" fill="#000" font-size="12" textLength="139.066">Descargar Guía en PDF</text><rect x="606.99" y="276.094" width="292" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="646.859" y="289.232" fill="#000" font-size="12" textLength="212.262">Descargar Código de Ejemplo (.zip)</text><line x1="6" y1="302.063" x2="603.49" y2="302.063" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="309.063" width="308" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="47.785" y="322.201" fill="#000" font-size="12" textLength="229.43">Marcar como Leído y Volver al Módulo</text><rect x="606.99" y="309.063" width="188" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="637.316" y="322.201" fill="#000" font-size="12" textLength="127.348">Siguiente Material -></text><?plantuml-src PLJ1RXit4BthA-PKI06yjjKwHGJRY2efjGB92gHDWgB8WTeToxHtoGt9LI2t0Tf_w0_qc4DE-GJzIR-aZwIahj25e5sGmpVllHdEI-k4SLOKZZv9mtT6b6nRlxK8p-NoUf0kg3_e3qVJN-YVF_wYT-F5R4x34KtxwMW-xazeE1vk_noauy7iydHv7SvTuTa3JBVVyhhGFRz9qxCkdT1KPaPRDckPIMtfE-gRZxLqdBdQ29gF5Ydz7euAnqQA8fxzkTv-5NJMxL6_TgoSp4GcjzyKlNwVqeQcGl63ffnf3X5ixodLZwniu75o4bvHrOvOAYlTH4wtNp85K3e5bddCzISLQI2TDZ4ovUoU9YnoDZIKlD8qrHiRmrB9PQLfP9qiHRw3xbvGAHK0R3CrOX3XkKwYw1XycUa2cLQ