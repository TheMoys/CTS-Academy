9" fill="#000" font-size="12" textLength="259.307">"# Validación de DTOs en Express y NestJS</text><text x="7" y="191.857" fill="#000" font-size="12" textLength="472.529">En este laboratorio aprenderemos a utilizar class-validator y class-transformer</text><text x="7" y="207.826" fill="#000" font-size="12" textLength="474.211">para garantizar que los payloads recibidos en endpoints REST cumplan con los</text><text x="7" y="223.795" fill="#000" font-size="12" textLength="357.82">contratos de interfaz antes de alcanzar la capa de dominio.</text><text x="22.264" y="239.764" fill="#000" font-size="12" textLength="11.449">1.</text><text x="37.527" y="239.764" fill="#000" font-size="12" textLength="191.877">Reglas de Validación Esenciales</text><text x="7" y="255.732" fill="#000" font-size="12" textLength="402.486">- @IsString() y @IsNotEmpty() para campos nominales obligatorios</text><text x="7" y="271.701" fill="#000" font-size="12" textLength="247.406">- @IsEmail() para credenciales de acceso</text><text x="7" y="287.67" fill="#000" font-size="12" textLength="391.066">- Sanitización de strings para prevenir inyecciones NoSQL y XSS"</text><line x1="6" y1="297" x2="1052.008" y2="297" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="313.639" fill="#000" font-size="12" textLength="266.385" font-weight="700">Archivo Adjunto / Recursos (.zip / .pdf):</text><rect x="277.885" y="305" width="196" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="311.382" y="318.139" fill="#000" font-size="12" textLength="129.006">Seleccionar archivo...</text><text x="481.385" y="313.639" fill="#000" font-size="12" textLength="171.41">ningún archivo seleccionado</text><line x1="479.385" y1="316.469" x2="698.385" y2="316.469" style="stroke:#000;stroke-width:1;"/><line x1="479.385" y1="313.469" x2="479.385" y2="315.469" style="stroke:#000;stroke-width:1;"/><line x1="698.385" y1="313.469" x2="698.385" y2="315.469" style="stroke:#000;stroke-width:1;"/><line