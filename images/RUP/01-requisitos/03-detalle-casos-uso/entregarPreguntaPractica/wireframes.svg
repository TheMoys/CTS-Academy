6" y="100.045" fill="#000" font-size="12" textLength="143.73" font-weight="700">Índice de Evaluación:</text><rect x="9.5" y="108.375" width="124" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="23.778" y="121.514" fill="#000" font-size="12" textLength="95.443">1-15 Teóricas ✓</text><text x="138" y="117.014" fill="#000" font-size="12" textLength="157.928" font-weight="700">[ Reto 1: Algoritmos • ]</text><rect x="300.428" y="108.375" width="172" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="324.266" y="121.514" fill="#000" font-size="12" textLength="124.324">Reto 2: Maquetación</text><line x1="6" y1="135.344" x2="877.729" y2="135.344" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="151.982" fill="#000" font-size="12" textLength="145.781" font-weight="700">Reto Práctico 01 / 02:</text><rect x="589.229" y="143.344" width="284" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="614.771" y="156.482" fill="#000" font-size="12" textLength="232.916">Área: Backend &amp; Lógica — Team Fénix</text><line x1="7" y1="169.313" x2="585.729" y2="169.313" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="184.951" fill="#000" font-size="12" textLength="135.34" font-weight="700">Enunciado del Reto:</text><text x="7" y="200.92" fill="#000" font-size="12" textLength="577.729">Implementar una función en TypeScript/JavaScript que reciba un flujo de eventos de candidatos</text><text x="7" y="216.889" fill="#000" font-size="12" textLength="574.025">y devuelva la agregación consolidada por sede, descartando duplicados mediante una ventana</text><text x="7" y="232.857" fill="#000" font-size="12" textLength="276.176">temporal de 500 ms (Deduplicación reactiva).</text><line x1="7" y1="241.188" x2="585.729" y2="241.188" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="256.826" fill="#000" font-size="12" textLength="225.762" font-weight="700">Criterios de Aceptación Técnicos:</text><ellipse cx="12.5" cy="268.125" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="272.795" fill="#000" font-size="12" textLength="409.236">Debe procesar arrays de hasta 10.000 eventos en menos de 50 ms.</text><ellipse cx="12.5" cy="284.094" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="288.764" fill="#000" font-size="12" textLength="534.094">No utilizar librerías externas para el filtrado temporal (solo estructuras nativas Map/Set).</text><ellipse cx="12.5" cy="300.063" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="304.732" fill="#000" font-size="12" textLength="385.248">Pasar la suite de 4 tests unitarios de validación (dedup.spec.ts).</text><line x1="6" y1="314.063" x2="877.729" y2="314.063" style="stroke:#AAA;stroke-width:1;"/><text x="8" y="329.701" fill="#000" font-size="12" textLength="72.117" font-weight="700">solution.ts</text><line x1="6" y1="318.563" x2="6" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="318.563" x2="83.117" y2="318.563" style="stroke:#000;stroke-width:1;"/><line x1="83.117" y1="318.563" x2="83.117" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="83.117" y1="332.531" x2="93.117" y2="332.531" style="stroke:#000;stroke-width:1;"/><text x="95.117" y="329.701" fill="#000" font-size="12" textLength="84.275">dedup.spec.ts</text><line x1="93.117" y1="318.563" x2="93.117" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="93.117" y1="318.563" x2="182.393" y2="318.563" style="stroke:#000;stroke-width:1;"/><line x1="182.393" y1="318.563" x2="182.393" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="182.393" y1="332.531" x2="192.393" y2="332.531" style="stroke:#000;stroke-width:1;"/><text x="194.393" y="329.701" fill="#000" font-size="12" textLength="79.219">package.json</text><line x1="192.393" y1="318.563" x2="192.393" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="192.393" y1="318.563" x2="276.611" y2="318.563" style="stroke:#000;stroke-width:1;"/><line x1="276.611" y1="318.563" x2="276.611" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="276.611" y1="332.531" x2="286.611" y2="332.531" style="stroke:#000;stroke-width:1;"/><text x="288.611" y="329.701" fill="#000" font-size="12" textLength="74.426">README.md</text><line x1="286.611" y1="318.563" x2="286.611" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="286.611" y1="318.563" x2="366.037" y2="318.563" style="stroke:#000;stroke-width:1;"/><line x1="366.037" y1="318.563" x2="366.037" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="366.037" y1="332.531" x2="376.037" y2="332.531" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="338.031" x2="877.729" y2="338.031" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="354.67" fill="#000" font-size="12" textLength="13.154">"1</text><text x="22.154" y="354.67" fill="#000" font-size="12" textLength="491.854">export function aggregateEvents(events: CandidateEvent[]): AggregatedResult[]"</text><text x="7" y="370.639" fill="#000" font-size="12" textLength="13.154">"2</text><text x="22.154" y="370.639" fill="#000" font-size="12" textLength="353.842">const seen = new Map();                                                    "</text><text x="7" y="386.607" fill="#000" font-size="12" textLength="13.154">"3</text><text x="22.154" y="386.607" fill="#000" font-size="12" textLength="373.547">const result: AggregatedResult[] = [];                                     "</text><text x="7" y="402.576" fill="#000" font-size="12" textLength="13.154">"4</text><text x="22.154" y="402.576" fill="#000" font-size="12" textLength="348.41">for (const event of events)                                                "</text><text x="7" y="418.545" fill="#000" font-size="12" textLength="13.154">"5</text><text x="22.154" y="418.545" fill="#000" font-size="12" textLength="366.779">const lastSeen = seen.get(event.id);                                     "</text><text x="7" y="434.514" fill="#000" font-size="12" textLength="13.154">"6</text><text x="22.154" y="434.514" fill="#000" font-size="12" textLength="72.498">if (!lastSeen</text><text x="516.008" y="434.514" fill="#000" font-size="12" textLength="312.809">(event.timestamp - lastSeen) >= 500)                    "</text><text x="7" y="450.482" fill="#000" font-size="12" textLength="13.154">"7</text><text x="22.154" y="450.482" fill="#000" font-size="12" textLength="362.502">seen.set(event.id, event.timestamp);                                   "</text><text x="7" y="466.451" fill="#000" font-size="12" textLength="13.154">"8</text><text x="22.154" y="466.451" fill="#000" font-size="12" textLength="318.563">result.push(event);                                                    "</text><text x="7" y="482.42" fill="#000" font-size="12" textLength="13.154">"9</text><text x="22.154" y="482.42" fill="#000" font-size="12" textLength="317.438">return result;                                                             "</text><line x1="6" y1="491.75" x2="877.729" y2="491.75" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="508.389" fill="#000" font-size="12" textLength="217.453" font-weight="700">Resultado TestRunner (Docker):</text><text x="393.656" y="508.389" fill="#000" font-size="12" textLength="277.529">3/4 tests superados (Ejecución 2/5 disponible)</text><text x="7" y="524.357" fill="#000" font-size="12" textLength="384.656" font-style="italic">Falla: Caso borde con timestamps desordenados (Edge Case 4).</text><line x1="6" y1="533.688" x2="877.729" y2="533.688" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="550.326" fill="#000" font-size="12" textLength="264.363" font-weight="700">Opción Repositorio Externo (Opcional):</text><text x="276.363" y="550.326" fill="#000" font-size="12" textLength="278.238">https://github.com/juanperez/cts-challenge-01</text><line x1="274.363" y1="553.156" x2="637.363" y2="553.156" style="stroke:#000;stroke-width:1;"/><line x1="274.363" y1="550.156" x2="274.363" y2="552.156" style="stroke:#000;stroke-width:1;