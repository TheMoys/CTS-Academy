<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:791px;height:205px;background:#FFFFFF;" width="791px" height="205px" viewBox="0 0 791 205" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="373.4" font-weight="700">CTS ACADEMY — CONFIRMACIÓN DE CIERRE DE SESIÓN</text><line x1="6" y1="24.469" x2="588.34" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="588.34" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="142.922" font-weight="700">Usuario Autenticado:</text><text x="152.736" y="41.107" fill="#000" font-size="12" textLength="233.672">Juan Pérez (Candidato — Sede Bogotá)</text><line x1="6" y1="49.438" x2="588.34" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="65.076" fill="#FFA500" font-size="12" textLength="340.594" font-weight="700">ADVERTENCIA DE PROCESO ACTIVO EN SERVIDOR:</text><text x="7" y="82.045" fill="#000" font-size="12" textLength="273.451">Dispone de una evaluación técnica en estado</text><text x="284.266" y="82.045" fill="#000" font-size="12" textLength="69.053" font-weight="700">EN CURSO</text><text x="357.133" y="82.045" fill="#000" font-size="12" textLength="183.311">(Test Técnico Multidisciplinar).</text><line x1="7" y1="90.375" x2="587.34" y2="90.375" style="stroke:#AAA;stroke-width:1;"/><ellipse cx="12.5" cy="101.344" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="106.014" fill="#000" font-size="12" textLength="247.189">El cronómetro se ejecuta en el servidor y</text><text x="270.004" y="106.014" fill="#000" font-size="12" textLength="94.91" font-weight="700">no se pausará</text><text x="368.729" y="106.014" fill="#000" font-size="12" textLength="114.105">al cerrar su sesión.</text><ellipse cx="12.5" cy="117.313" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="121.982" fill="#000" font-size="12" textLength="512.396">El tiempo límite continuará corriendo conforme a la política del programa (ADR-007).</text><ellipse cx="12.5" cy="133.281" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="137.951" fill="#000" font-size="12" textLength="567.34">Para reanudar el test, deberá volver a iniciar sesión antes de que el cronómetro llegue a cero.</text><line x1="6" y1="147.281" x2="588.34" y2="147.281" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="162.92" fill="#000" font-size="12" textLength="340.74" font-weight="700">¿Está seguro de que desea cerrar la sesión ahora?</text><line x1="6" y1="171.25" x2="588.34" y2="171.25" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="178.25" width="284" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="45.386" y="191.389" fill="#000" font-size="12" textLength="210.229">Cancelar y Permanecer en el Panel</text><text x="589.34" y="186.889" fill="#000" font-size="12" textLength="194.666" font-weight="700">[ Confirmar y Cerrar Sesión ]</text><?plantuml-src LLFDRjD04BxdAURO89A62e6eGgYnZMIan96THaAeXuaz3OlMksQz6yHF9Tu1Ng377ZZr0P3mc_0apDffrEvflVlDzttpxVYiiMXiWzB2Ps7eqc15pU3R07XDDxDmbKCG1b4yVmV_Vlo2C5syIR9v42RjpmL4COH9d6Mnt-LnxW-dnvjPL_sIrntDUUFG20s1iwIiAB3Kfnu8RnqgMBOtXhx2KOYg52LQtKdbL1Ayrbjjs-jXHpGQzNo5bjgSQeDgIpDc3w9rdAtYHPW4tiWoIyCuJzdtAbcd42_OMhPEeZJhDAV7NNrlic_KhqWqjLO4BEeK0krGEYn4Uwl0jZU5OjD02eZpAhNlYNd3yonFkpwELdm1gnweOUwa5QLe2b5BeT0CnmUTVHD-FO9OGc6qQcyhiaP3Gq0VgN2sbv9yO7QYr0Q-U4NL8Mfq3PhskjD59Y1Zq43Z-BBnViSF1QoWgjOWsz-Li0I5vWTGpZFmtXX1YllXqqjjAW84YL1hHljduZGar4PlUImGZe8e6qqcpuVt5PPe40oXSYMxOBZb91vpuOQyn4xB7Hcc5HoCy3vxau2AWJxjJuvysVqSfAIjyrwuDzsBNJsOWCtixv-uuS5WkgtZYZrFIGtXNIBSo47i0q_BgyDexcdU0qzSGH9zlaio5IhYsdtsI_wIS07VlHn3EI7148yDUu5yptxH4LyDpZXA_oSD1a_69vEJP-CN6xBuz3y0?></g></svg>