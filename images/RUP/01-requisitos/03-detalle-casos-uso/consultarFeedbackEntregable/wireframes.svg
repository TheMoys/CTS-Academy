<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1151px;height:306px;background:#FFFFFF;" width="1151px" height="306px" viewBox="0 0 1151 306" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="534.639" font-weight="700">CTS ACADEMY — DETALLE Y RETROALIMENTACIÓN DE ENTREGABLE DE CÓDIGO</text><line x1="6" y1="24.469" x2="760" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="760" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="83.648" font-weight="700">Laboratorio:</text><text x="93.463" y="41.107" fill="#000" font-size="12" textLength="271.635">Lab 02: Middleware de Autenticación &amp; Tests</text><text x="761" y="41.107" fill="#000" font-size="12" textLength="54.475" font-weight="700">Módulo:</text><text x="819.289" y="41.107" fill="#000" font-size="12" textLength="170.525">M02 - Microservicios &amp; REST</text><text x="6" y="57.076" fill="#000" font-size="12" textLength="56.033" font-weight="700">Alumno:</text><text x="65.848" y="57.076" fill="#000" font-size="12" textLength="131.555">Carlos Mendoza Rivas</text><text x="761" y="57.076" fill="#000" font-size="12" textLength="128.291" font-weight="700">Tech Leader Tutor:</text><text x="893.105" y="57.076" fill="#000" font-size="12" textLength="69.779">Diego Moys</text><rect x="994.314" y="48.438" width="148" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="1018.208" y="61.576" fill="#000" font-size="12" textLength="100.213">Volver al Módulo</text><line x1="6" y1="74.406" x2="760" y2="74.406" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="91.045" fill="#000" font-size="12" textLength="162.955" font-weight="700">Repositorio del Alumno:</text><text x="173.77" y="91.045" fill="#000" font-size="12" textLength="342.785">github.com/cts-academy-students/carlos-mendoza-lab02</text><text x="7" y="107.014" fill="#000" font-size="12" textLength="164.303" font-weight="700">Pull Request Entregado:</text><text x="175.117" y="107.014" fill="#000" font-size="12" textLength="250.172">PR #14 (Rama: feature/auth-middleware)</text><text x="518.555" y="107.014" fill="#000" font-size="12" textLength="123.193" font-weight="700">Fecha de Entrega:</text><text x="645.563" y="107.014" fill="#000" font-size="12" textLength="107.561">18/10/2026 15:42</text><text x="7" y="122.982" fill="#000" font-size="12" textLength="180.891" font-weight="700">Dictamen del Tech Leader:</text><text x="187.891" y="122.982" fill="#000" font-size="12"> </text><text x="191.705" y="122.982" fill="#FFA500" font-size="12" textLength="309.469" font-weight="700">CAMBIOS SOLICITADOS (Requiere Corrección)</text><text x="7" y="138.951" fill="#000" font-size="12" textLength="156.92" font-weight="700">Calificación Preliminar:</text><text x="167.734" y="138.951" fill="#000" font-size="12" textLength="57.475">6.0 / 10.0</text><text x="518.555" y="138.951" fill="#000" font-size="12" textLength="127.33" font-weight="700">Fecha de Revisión:</text><text x="649.699" y="138.951" fill="#000" font-size="12" textLength="107.561">19/10/2026 11:30</text><line x1="6" y1="148.281" x2="760" y2="148.281" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="163.92" fill="#000" font-size="12" textLength="404.004" font-weight="700">OBSERVACIONES TÉCNICAS Y FEEDBACK DEL TECH LEADER:</text><text x="7" y="180.889" fill="#000" font-size="12" textLength="582.598">"Buen avance en la estructura de los middlewares, Carlos. Sin embargo, hay dos puntos críticos:</text><text x="7" y="196.857" fill="#000" font-size="12" textLength="668.461">1. El middleware verifyToken no está manejando adecuadamente la expiración de tokens (TokenExpiredError).</text><text x="7" y="212.826" fill="#000" font-size="12" textLength="546.498">Actualmente devuelve un 500 en lugar de un código HTTP 401 Unauthorized estructurado.</text><text x="7" y="228.795" fill="#000" font-size="12" textLength="650.736">2. Faltan los tests unitarios para verificar el caso en que el header Authorization venga vacío o malformado.</text><text x="7" y="244.764" fill="#000" font-size="12" textLength="484.951">Corrige estos dos puntos, actualiza tu rama en GitHub y solicita nueva revisión."</text><line x1="6" y1="254.094" x2="760" y2="254.094" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="269.732" fill="#000" font-size="12" textLength="167.631" font-weight="700">ACCIONES DISPONIBLES:</text><rect x="9.5" y="278.063" width="356" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="41.947" y="291.201" fill="#000" font-size="12" textLength="291.105" font-weight="700">Actualizar Entrega / Reenviar PR Corregido</text><rect x="372.5" y="278.063" width="228" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="404.926" y="291.201" fill="#000" font-size="12" textLength="163.148">Ver Pull Request en GitHub</text><rect x="607.5" y="278.063" width="148" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="631.394" y="291.201" fill="#000" font-size="12" textLength="100.213">Volver al Módulo</text><?plantuml-src VLNRRjj647tNLmnIeB01Iw9K9sW4rmX5qRPGtK0o0OB03oDo9Mswt7MNkqgLra1V-vp-G3yWJ_a4_Kc_9BChwc8W25_89MVcpEMSuQlAe3OL2WCVk6OBZIMh6dysWAwh-NMKfH16uI0UluN___uN1d4MZaOnl8Kapf9fE1gEuqaMHiFjfmbz13eayMtO9nCwHTjFW-7jzAezl_O1Vw5h7tc4SwNHACrLpna0lO2WsuCnBmh1Fg1cK308hM7Iy1npllqYuKV8M6Kg-Ck566-_55RKxkEW2qrophMgc5xpdAkAp9CupVQGeR2bhCqZr88CnamMwYD2mjTOHyrOle8Hmu9fo2mbk7COSBPKC5ORP_OEtYYn9WCKK6S1znwcsVItNGDht8Gzg8hxKgaa0QTvBBbPsNahLsKxDrKJSy8jDytAs8BghjgvpxDPxl9i2fm7tTFOCoi49EntIss1M1hDbbZKiMS9_D2vXBC4I-p1Wg6nchNHcbMpF3JvV5Vr3LMDhk5rZ5s4pi_jJj3k1jqNq7dUkto2FE2v8R98Nz99qtQULxaIr3eQiLooQyUaSDmVJbD8fwDXD