e="12" textLength="197.748">Técnico: 42% (Afinidad dispersa)</text><text x="7" y="98.014" fill="#000" font-size="12" textLength="112.377" font-weight="700">Entrevista Meet:</text><text x="123.191" y="98.014" fill="#000" font-size="12" textLength="140.707">Realizada (04/11/2026)</text><text x="265.898" y="98.014" fill="#000" font-size="12" textLength="124.799" font-weight="700">Dictamen Rúbrica:</text><text x="394.512" y="98.014" fill="#000" font-size="12" textLength="231.914">Desfavorable (Indisponibilidad on-site)</text><line x1="6" y1="107.344" x2="1369" y2="107.344" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="123.982" fill="#000" font-size="12" textLength="375.275" font-weight="700">1. FUNDAMENTACIÓN DEL DICTAMEN DE NO ADMISIÓN:</text><line x1="7" y1="132.313" x2="822" y2="132.313" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="147.951" fill="#000" font-size="12" textLength="206.455" font-weight="700">Motivo Tipificado Principal (*):</text><rect x="823" y="136.813" width="543" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="825" y="149.951" fill="#000" font-size="12" textLength="403.559">Incompatibilidad con régimen de estancia on-site (Turno intensivo)</text><line x1="1355" y1="136.813" x2="1355" y2="153.781" style="stroke:#000;stroke-width:1;"/><polygon points="1358,142.813,1364,142.813,1361,148.781" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="7" y1="160.281" x2="822" y2="160.281" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="175.92" fill="#000" font-size="12" textLength="427.816" font-weight="700">Justificación Cualitativa Interna (Exclusiva para el expediente):</text><text x="10" y="191.889" fill="#000" font-size="12" textLength="597.445">El candidato manifestó durante la entrevista que no cuenta con disponibilidad horaria para cumplir</text><line x1="8" y1="194.719" x2="819" y2="194.719" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="191.719" x2="8" y2="193.719" style="stroke:#000;stroke-width:1;"/><line x1="819" y1="191.719" x2="819" y2="193.719" style="stroke:#000;stroke-width:1;"/><text x="10" y="209.857" fill="#000" font-size="12" textLength="601.225">con el turno de prácticas on-site en Santander debido a compromisos académicos incompatibles en</text><line x1="8" y1="212.688" x2="811" y2="212.688" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="209.688" x2="8" y2="211.688" style="stroke:#000;stroke-width:1;"/><line x1="811" y1="209.688" x2="811" y2="211.688" style="stroke:#000;stroke-width:1;"/><text x="10" y="227.826" fill="#000" font-size="12" textLength="577.67">su sede de origen. Adicionalmente, los indicadores diagnósticos muestran dispersión formativa.</text><line x1="8" y1="230.656" x2="811" y2="230.656" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="227.656" x2="8" y2="229.656" style="stroke:#000;stroke-width:1;"/><line x1="811" y1="227.656" x2="811" y2="229.656" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="239.156" x2="1369" y2="239.156" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="255.795" fill="#000" font-size="12" textLength="341.109" font-weight="700">2. NOTIFICACIÓN INSTITUCIONAL DE RESOLUCIÓN:</text><line x1="7" y1="264.125" x2="567.162" y2="264.125" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="279.764" fill="#000" font-size="12" textLength="201.006" font-weight="700">Plantilla de Comunicación (*):</text><rect x="568.162" y="268.625" width="543" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="570.162" y="281.764" fill="#000" font-size="12" textLength="438.996">Carta Estándar de No Admisión con Recomendación Formativa (PROFER)</text><line x1="1100.162" y1="268.625" x2="1100.162" y2="285.594" style="stroke:#000;stroke-width:1;"/><polygon points="1103.162,274.625,1109.162,274.625,1106.162,280.594" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27" y="299.732" fill="#000" font-size