<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1565px;height:189px;background:#FFFFFF;" width="1565px" height="189px" viewBox="0 0 1565 189" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="473.396" font-weight="700">CTS ACADEMY — CONFIRMAR DESACTIVACIÓN DE PREGUNTA TÉCNICA</text><line x1="6" y1="24.469" x2="1155.42" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="1155.42" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="85.764" font-weight="700">Pregunta ID:</text><text x="95.578" y="41.107" fill="#000" font-size="12" textLength="59.689">PREG-108</text><text x="1156.42" y="41.107" fill="#000" font-size="12" textLength="70.541" font-weight="700">Categoría:</text><text x="1230.775" y="41.107" fill="#000" font-size="12" textLength="164.531">APIs REST &amp; Seguridad JWT</text><text x="1397.307" y="41.107" fill="#000" font-size="12" textLength="87.486" font-weight="700">Tech Leader:</text><text x="1488.607" y="41.107" fill="#000" font-size="12" textLength="69.779">Diego Moys</text><line x1="6" y1="49.438" x2="1155.42" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="66.076" fill="#000" font-size="12" textLength="485.883" font-weight="700">¿Está seguro de que desea desactivar esta pregunta técnica del banco?</text><text x="7" y="82.045" fill="#000" font-size="12" textLength="74.783" font-weight="700">Enunciado:</text><text x="85.598" y="82.045" fill="#000" font-size="12" textLength="637.148">¿Qué vulnerabilidad de seguridad mitiga principalmente la configuración de la directiva SameSite=Strict?</text><text x="7" y="98.014" fill="#000" font-size="12" textLength="70.4" font-weight="700">Dificultad:</text><text x="81.215" y="98.014" fill="#000" font-size="12" textLength="58.881">Avanzado</text><text x="724.746" y="98.014" fill="#000" font-size="12" textLength="51.803" font-weight="700">Puntos:</text><text x="780.363" y="98.014" fill="#000" font-size="12" textLength="41.473">1.5 pts</text><text x="823.836" y="98.014" fill="#000" font-size="12" textLength="228.041" font-weight="700">Tests previos que la han incluido:</text><text x="1055.691" y="98.014" fill="#000" font-size="12" textLength="97.729">34 evaluaciones</text><text x="7" y="113.982" fill="#F00" font-size="12" textLength="176.818" font-weight="700">POLÍTICA DE INTEGRIDAD:</text><text x="7" y="129.951" fill="#000" font-size="12" textLength="561.814">La pregunta pasará a estado INACTIVA y no volverá a ser seleccionada en futuros exámenes.</text><text x="7" y="145.92" fill="#000" font-size="12" textLength="553.816">Los resultados e historial de los 34 tests previamente completados se mantendrán intactos.</text><line x1="6" y1="155.25" x2="1155.42" y2="155.25" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="162.25" width="300" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="31.888" y="175.389" fill="#F00" font-size="12" textLength="253.225" font-weight="700">Confirmar Desactivación de Pregunta</text><rect x="1158.92" y="162.25" width="84" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="1174.45" y="175.389" fill="#000" font-size="12" textLength="52.939">Cancelar</text><?plantuml-src RLDDRzD04BtdLyo9MzAc50HLlopRL4Pj6c83GbKFa_MaNMcp6tRNXWALk7BW17-WnnuuyGCgrV-4NyAitRGHOgN4oUxClZVlFUyxZzOxL1u-I4ipYtDolSyzuBKztOsB7A8uIjAZT_3dwq-8ZqSliibHD84apQEuoDv4STRy6F5V64_IWzUZ8eAY-HQFiZZQNflkjXVjy5hUEBPqLccFa2LReQ1jwm_Ndy6N5X0zdHdR_CBkD1fd3YPfNi0ZoBdJoX9BUFcswCeB4kTmI5YIxUeJoUrmP2vS2zZljuzkdZi6jpUfyyqLk72TWPBWVKNyS8JX6uMNDLeWLWOMIxQ-kHPQYb2XO8fQcBtxyS9Q1KXrfON4qdIKRczULSqrr9NIP74gLJi2mxhxUURIoxE09hbnWMfEsXCe167qJ78L2jdyrg69DqisgYK9ERkLIqyxkRTI-BrL5