xt x="7" y="191.857" fill="#000" font-size="12" textLength="428.971">Actualizado para incluir política estricta de rotación de Refresh Tokens.</text><text x="22.264" y="207.826" fill="#000" font-size="12" textLength="11.449">1.</text><text x="37.527" y="207.826" fill="#000" font-size="12" textLength="107.807">Flujo de Rotación:</text><text x="7" y="223.795" fill="#000" font-size="12" textLength="307.066">1. Cliente envía Refresh Token en cookie HttpOnly.</text><text x="7" y="239.764" fill="#000" font-size="12" textLength="275.918">2. Servidor valida firma y existencia en Redis.</text><text x="7" y="255.732" fill="#000" font-size="12" textLength="460.646">3. Se invalida el token consumido y se emite un nuevo par de credenciales."</text><line x1="6" y1="265.063" x2="1038.371" y2="265.063" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="281.701" fill="#000" font-size="12" textLength="193.008" font-weight="700">Recursos Adjuntos Actuales:</text><rect x="204.508" y="273.063" width="292" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="248.177" y="286.201" fill="#000" font-size="12" textLength="204.662">Descargar jwt-auth-boilerplate.zip</text><rect x="503.508" y="273.063" width="188" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="531.903" y="286.201" fill="#000" font-size="12" textLength="131.209">Reemplazar archivo...</text><line x1="6" y1="300.031" x2="1038.371" y2="300.031" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="307.031" width="140" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="20.155" y="320.17" fill="#000" font-size="12" textLength="116.689" font-weight="700">Guardar Cambios</text><rect x="1041.871" y="307.031" width="156" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="1062.604" y="320.17" fill="#000" font-size="12" textLength="114.533">Descartar Cambios</text><?plantuml-src bLJR