<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1692px;height:483px;background:#FFFFFF;" width="1692px" height="483px" viewBox="0 0 1692 483" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="519.943" font-weight="700">CTS ACADEMY — REGISTRO DE ANOTACIONES CUALITATIVAS DE ENTREVISTA</text><line x1="6" y1="24.469" x2="1193" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="1193" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="73.617" font-weight="700">Candidato:</text><text x="83.432" y="41.107" fill="#000" font-size="12" textLength="131.555">Carlos Mendoza Rivas</text><text x="1194" y="41.107" fill="#000" font-size="12" textLength="80.725" font-weight="700">Expediente:</text><text x="1278.539" y="41.107" fill="#000" font-size="12" textLength="114.955">CTS-2026-SDR-014</text><text x="1431.822" y="41.107" fill="#000" font-size="12" textLength="49.828" font-weight="700">Gestor:</text><text x="1485.465" y="41.107" fill="#000" font-size="12" textLength="200.215">Diego Moys (TL / Gestor PROFER)</text><text x="6" y="57.076" fill="#000" font-size="12" textLength="144.92" font-weight="700">Entrevista Vinculada:</text><text x="154.734" y="57.076" fill="#000" font-size="12" textLength="223.799">Google Meet (05/11/2026 10:30 CET)</text><text x="1194" y="57.076" fill="#000" font-size="12" textLength="50.807" font-weight="700">Estado:</text><text x="1248.621" y="57.076" fill="#000" font-size="12" textLength="162.873">Realizada / En deliberación</text><line x1="6" y1="65.406" x2="1193" y2="65.406" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="82.045" fill="#000" font-size="12" textLength="441.973" font-weight="700">1. BITÁCORA HISTÓRICA DE ANOTACIONES (ENTRADAS PREVIAS):</text><line x1="7" y1="90.375" x2="990" y2="90.375" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="106.014" fill="#000" font-size="12" textLength="358.594" font-weight="700">[18/10/2026 11:20] Pre-Entrevista — Gestor PROFER:</text><text x="10" y="121.982" fill="#000" font-size="12" textLength="734.191">Revisión de portfolio y perfil GitHub. Fuerte afinidad técnica en Node.js y Docker. Candidato remitido por sede Santander.</text><line x1="8" y1="124.813" x2="987" y2="124.813" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="121.813" x2="8" y2="123.813" style="stroke:#000;stroke-width:1;"/><line x1="987" y1="121.813" x2="987" y2="123.813" style="stroke:#000;stroke-width:1;"/><line x1="7" y1="132.313" x2="990" y2="132.313" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="147.951" fill="#000" font-size="12" textLength="365.191" font-weight="700">[05/11/2026 11:15] En Sesión Meet — Gestor PROFER:</text><text x="10" y="163.92" fill="#000" font-size="12" textLength="709.23">Excelente desenvolvimiento verbal. Explica con claridad el ciclo de vida de un microservicio y la justificación de DDD.</text><line x1="8" y1="166.75" x2="963" y2="166.75" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="163.75" x2="8" y2="165.75" style="stroke:#000;stroke-width:1;"/><line x1="963" y1="163.75" x2="963" y2="165.75" style="stroke:#000;stroke-width:1;"/><line x1="6" y1="175.25" x2="1193" y2="175.25" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="191.889" fill="#000" font-size="12" textLength="343.125" font-weight="700">2. NUEVA ENTRADA DE EVALUACIÓN CUALITATIVA:</text><line x1="7" y1="200.219" x2="878" y2="200.219" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="215.857" fill="#000" font-size="12" textLength="171.779" font-weight="700">Momento de Registro (*):</text><rect x="879" y="204.719" width="127" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="881" y="217.857" fill="#000" font-size="12" textLength="84.838">Pre-Entrevista</text><line x1="995" y1="204.719" x2="995" y2="221.688" style="stroke:#000;stroke-width:1;"/><polygon points="998,210.719,1004,210.719,1001,216.688" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="7" y1="228.188" x2="878" y2="228.188" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="243.826" fill="#000" font-size="12" textLength="335.59" font-weight="700">Dimensiones de la Rúbrica Cualitativa (ADR-007):</text><text x="8" y="260.795" fill="#000" font-size="12" textLength="71.303" font-weight="700">Dimensión</text><text x="283.17" y="260.795" fill="#000" font-size="12" textLength="120.07" font-weight="700">Valoración (1 a 5)</text><text x="446.234" y="260.795" fill="#000" font-size="12" textLength="128.59" font-weight="700">Criterio Cualitativo</text><line x1="8" y1="269.125" x2="282.17" y2="269.125" style="stroke:#AAA;stroke-width:1;"/><text x="8" y="284.764" fill="#000" font-size="12" textLength="241.512">Comunicación y Argumentación Técnica</text><text x="303.17" y="284.764" fill="#000" font-size="12" textLength="141.064">1  ( ) 2  ( ) 3  ( ) 4  (X) 5</text><ellipse cx="290.17" cy="280.609" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="446.234" y="284.764" fill="#000" font-size="12" textLength="192.932">Excepcional claridad y precisión</text><text x="8" y="300.732" fill="#000" font-size="12" textLength="226.219">Fit Cultural y Trabajo en Equipo (CTS)</text><text x="303.17" y="300.732" fill="#000" font-size="12" textLength="141.064">1  ( ) 2  ( ) 3  (X) 4  ( ) 5</text><ellipse cx="290.17" cy="296.578" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="446.234" y="300.732" fill="#000" font-size="12" textLength="205.254">Alta afinidad con dinámicas ágiles</text><text x="8" y="316.701" fill="#000" font-size="12" textLength="192.791">Actitud Profesional y Resolución</text><text x="303.17" y="316.701" fill="#000" font-size="12" textLength="141.064">1  ( ) 2  ( ) 3  ( ) 4  (X) 5</text><ellipse cx="290.17" cy="312.547" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="446.234" y="316.701" fill="#000" font-size="12" textLength="200.514">Proactivo y receptivo al feedback</text><text x="8" y="332.67" fill="#000" font-size="12" textLength="273.17">Compromiso con Estancia On-Site / Movilidad</text><text x="303.17" y="332.67" fill="#000" font-size="12" textLength="141.064">1  ( ) 2  ( ) 3  (X) 4  ( ) 5</text><ellipse cx="290.17" cy="328.516" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="446.234" y="332.67" fill="#000" font-size="12" textLength="223.875">Disponibilidad confirmada para turno</text><line x1="7" y1="342" x2="878" y2="342" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="357.639" fill="#000" font-size="12" textLength="373.658" font-weight="700">Observaciones Detalladas y Evidencias Observadas (*):</text><text x="10" y="373.607" fill="#000" font-size="12" textLength="655.711">El candidato demostró gran madurez durante la sesión por Google Meet. Tiene bases sólidas en arquitectura</text><line x1="8" y1="376.438" x2="875" y2="376.438" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="373.438" x2="8" y2="375.438" style="stroke:#000;stroke-width:1;"/><line x1="875" y1="373.438" x2="875" y2="375.438" style="stroke:#000;stroke-width:1;"/><text x="10" y="391.576" fill="#000" font-size="12" textLength="616.078">backend y disposición total para incorporarse al turno intensivo de desarrollo on-site. Encaja de forma</text><line x1="8" y1="394.406" x2="875" y2="394.406" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="391.406" x2="8" y2="393.406" style="stroke:#000;stroke-width:1;"/><line x1="875" y1="391.406" x2="875" y2="393.406" style="stroke:#000;stroke-width:1;"/><text x="10" y="409.545" fill="#000" font-size="12" textLength="599.438">óptima en el Equipo 01 (Backend &amp; Arquitectura). Se recomienda proceder con su admisión formal.</text><line x1="8" y1="412.375" x2="867" y2="412.375" style="stroke:#000;stroke-width:1;"/><line x1="8" y1="409.375" x2="8" y2="411.375" style="stroke:#000;stroke-width:1;"/><line x1="867" y1="409.375" x2="867" y2="411.375" style="stroke:#000;stroke-width:1;"/><line x1="7" y1="419.875" x2="878" y2="419.875" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="435.514" fill="#000" font-size="12" textLength="208.395" font-weight="700">Dictamen Preliminar Sugerido:</text><rect x="879" y="424.375" width="311" height="16.969" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="881" y="437.514" fill="#000" font-size="12" textLength="249.035">Favorable (Recomendado para Admisión)</text><line x1="1179" y1="424.375" x2="1179" y2="441.344" style="stroke:#000;stroke-width:1;"/><polygon points="1182,430.375,1188,430.375,1185,436.344" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="6" y1="448.844" x2="1193" y2="448.844" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="455.844" width="84" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="24.03" y="468.982" fill="#000" font-size="12" textLength="52.939">Cancelar</text><text x="1194" y="464.482" fill="#000" font-size="12" textLength="235.822" font-weight="700">[ Registrar Anotación en Bitácora ]</text><rect x="879" y="221.688" width="203.768" height="26.938" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="879" y="232.826" fill="#000" font-size="12" textLength="138.305">En Sesión Google Meet</text><text x="879" y="246.795" fill="#000" font-size="12" textLength="204.768">Post-Deliberación (Recomendado)</text><rect x="879" y="441.344" width="310" height="26.938" fill="#EEE" style="stroke:#000;stroke-width:1;"/><text x="879" y="452.482" fill="#000" font-size="12" textLength="143.49">Favorable con Reservas</text><text x="879" y="466.451" fill="#000" font-size="12" textLength="79.518">Desfavorable</text><?plantuml-src ZLRDRjj6