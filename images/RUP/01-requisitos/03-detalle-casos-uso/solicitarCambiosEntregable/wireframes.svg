<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:971px;height:388px;background:#FFFFFF;" width="971px" height="388px" viewBox="0 0 971 388" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="515.133" font-weight="700">CTS ACADEMY — SOLICITAR CAMBIOS EN ENTREGABLE (REQUEST CHANGES)</text><line x1="6" y1="24.469" x2="634.596" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="634.596" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="56.033" font-weight="700">Alumno:</text><text x="65.848" y="41.107" fill="#000" font-size="12" textLength="157.559">Mariam Fernanda Paredes</text><text x="635.596" y="41.107" fill="#000" font-size="12" textLength="54.475" font-weight="700">Módulo:</text><text x="693.885" y="41.107" fill="#000" font-size="12" textLength="270.762">M02: Lab 03 - Tests de Integración Supertest</text><text x="6" y="57.076" fill="#000" font-size="12" textLength="87.486" font-weight="700">Tech Leader:</text><text x="97.301" y="57.076" fill="#000" font-size="12" textLength="69.779">Diego Moys</text><rect x="638.096" y="48.438" width="84" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="653.626" y="61.576" fill="#000" font-size="12" textLength="52.939">Cancelar</text><line x1="6" y1="74.406" x2="634.596" y2="74.406" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="91.045" fill="#000" font-size="12" textLength="97.875" font-weight="700">Estado Actual:</text><text x="108.689" y="91.045" fill="#000" font-size="12" textLength="131.291">PENDIENTE_REVISION</text><text x="412.893" y="91.045" fill="#000" font-size="12" textLength="90.07" font-weight="700">Pull Request:</text><text x="506.777" y="91.045" fill="#000" font-size="12" textLength="125.818">PR #21 (github.com)</text><text x="7" y="107.014" fill="#000" font-size="12" textLength="186.803" font-weight="700">Resultado Sandbox Docker:</text><text x="193.803" y="107.014" fill="#000" font-size="12"> </text><text x="197.617" y="107.014" fill="#FFA500" font-size="12" textLength="213.275" font-weight="700">9 Tests Pasados / 1 Test Fallido</text><line x1="6" y1="116.344" x2="634.596" y2="116.344" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="131.982" fill="#000" font-size="12" textLength="395.766" font-weight="700">MOTIVOS PRINCIPALES DEL REQUERIMIENTO DE CAMBIOS:</text><text x="27" y="148.951" fill="#000" font-size="12" textLength="300.539">Fallo en pruebas automatizadas del pipeline de CI</text><rect x="9" y="139.797" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><polygon points="10,143.813,13,146.813,20,137.813,13,144.813" fill="#000" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27" y="164.92" fill="#000" font-size="12" textLength="368.426">Ausencia o inconsistencia en el manejo de excepciones HTTP</text><rect x="9" y="155.766" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><polygon points="10,159.781,13,162.781,20,153.781,13,160.781" fill="#000" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27" y="180.889" fill="#000" font-size="12" textLength="398.648">Incumplimiento de convenciones de nombres o formato de código</text><rect x="9" y="171.734" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="27" y="196.857" fill="#000" font-size="12" textLength="316.283">Cobertura de tests inferior al umbral mínimo exigido</text><rect x="9" y="187.703" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><line x1="6" y1="206.188" x2="634.596" y2="206.188" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="221.826" fill="#000" font-size="12" textLength="478.529" font-weight="700">OBSERVACIONES TÉCNICAS Y GUÍA DE CORRECCIÓN PARA EL ALUMNO:</text><text x="7" y="238.795" fill="#000" font-size="12" textLength="589.207">"Mariam, la suite de integración está fallando en el escenario de creación de recursos duplicados.</text><text x="7" y="254.764" fill="#000" font-size="12" textLength="609.785">1. El endpoint POST /api/v1/modules debe capturar la violación de unicidad del índice (código 23505)</text><text x="7" y="270.732" fill="#000" font-size="12" textLength="559.623">y mapearlo a un HTTP 409 Conflict en lugar de lanzar una excepción genérica no controlada.</text><text x="7" y="286.701" fill="#000" font-size="12" textLength="552.217">2. Agrega la prueba que valide la estructura de la respuesta JSON ante el error de conflicto.</text><text x="7" y="302.67" fill="#000" font-size="12" textLength="558.475">Por favor actualiza tu rama y vuelve a solicitar revisión cuando los 10 tests pasen en verde."</text><line x1="6" y1="312" x2="634.596" y2="312" style="stroke:#AAA;stroke-width:1;"/><text x="27" y="328.639" fill="#000" font-size="12" textLength="385.43">Enviar notificación automática por correo con las observaciones</text><rect x="9" y="319.484" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><polygon points="10,323.5,13,326.5,20,317.5,13,324.5" fill="#000" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27" y="344.607" fill="#000" font-size="12" textLength="351.416">Mantener el laboratorio en estado editable para el alumno</text><rect x="9" y="335.453" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><polygon points="10,339.469,13,342.469,20,333.469,13,340.469" fill="#000" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="6" y1="353.938" x2="634.596" y2="353.938" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="360.938" width="260" height="