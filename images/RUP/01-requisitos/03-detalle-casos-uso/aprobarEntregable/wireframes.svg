<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:965px;height:380px;background:#FFFFFF;" width="965px" height="380px" viewBox="0 0 965 380" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="468.387" font-weight="700">CTS ACADEMY — EMITIR DICTAMEN DE APROBACIÓN DE ENTREGABLE</text><line x1="6" y1="24.469" x2="662.705" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="662.705" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="56.033" font-weight="700">Alumno:</text><text x="65.848" y="41.107" fill="#000" font-size="12" textLength="131.555">Carlos Mendoza Rivas</text><text x="663.705" y="41.107" fill="#000" font-size="12" textLength="54.475" font-weight="700">Módulo:</text><text x="721.994" y="41.107" fill="#000" font-size="12" textLength="236.15">M02: Lab 02 - Auth Middleware &amp; Tests</text><text x="6" y="57.076" fill="#000" font-size="12" textLength="87.486" font-weight="700">Tech Leader:</text><text x="97.301" y="57.076" fill="#000" font-size="12" textLength="69.779">Diego Moys</text><rect x="666.205" y="48.438" width="156" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="686.874" y="61.576" fill="#000" font-size="12" textLength="114.662">Cancelar Dictamen</text><line x1="6" y1="74.406" x2="662.705" y2="74.406" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="91.045" fill="#000" font-size="12" textLength="233.602" font-weight="700">Calificación Numérica (0.0 a 10.0):</text><text x="242.602" y="91.045" fill="#000" font-size="12" textLength="241.793">"9.5" / 10.0  *(Mínimo aprobatorio: 7.0)*</text><text x="7" y="107.014" fill="#000" font-size="12" textLength="222.967" font-weight="700">Resultado en Tests Automáticos:</text><text x="242.602" y="107.014" fill="#008000" font-size="12" textLength="203.924">12 de 12 Tests Superados (100%)</text><text x="7" y="122.982" fill="#000" font-size="12" textLength="203.777" font-weight="700">Nivel de Cobertura de Código:</text><text x="242.602" y="122.982" fill="#000" font-size="12" textLength="207.322">94.2% (Supera el umbral del 85%)</text><line x1="6" y1="132.313" x2="662.705" y2="132.313" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="147.951" fill="#000" font-size="12" textLength="348.211" font-weight="700">EVALUACIÓN POR CRITERIOS DE RÚBRICA TÉCNICA:</text><text x="7" y="164.92" fill="#000" font-size="12" textLength="50.988" font-weight="700">Criterio</text><text x="197.924" y="164.92" fill="#000" font-size="12" textLength="84.34" font-weight="700">Ponderación</text><text x="284.264" y="164.92" fill="#000" font-size="12" textLength="71.771" font-weight="700">Valoración</text><line x1="7" y1="173.25" x2="196.924" y2="173.25" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="188.889" fill="#000" font-size="12" textLength="174.686">Arquitectura y Diseño Limpio</text><text x="197.924" y="188.889" fill="#000" font-size="12" textLength="26.672">30%</text><text x="284.264" y="188.889" fill="#000" font-size="12" textLength="192.908">^Excelente (3.0 pts)^Excelente</text><text x="479.172" y="188.889" fill="#000" font-size="12" textLength="59.725">Adecuado</text><text x="540.896" y="188.889" fill="#000" font-size="12" textLength="46.564">Regular</text><text x="589.461" y="188.889" fill="#000" font-size="12" textLength="71.244">Deficiente^</text><text x="7" y="204.857" fill="#000" font-size="12" textLength="188.924">Calidad del Código &amp; Tipado TS</text><text x="197.924" y="204.857" fill="#000" font-size="12" textLength="26.672">30%</text><text x="284.264" y="204.857" fill="#000" font-size="12" textLength="192.908">^Excelente (3.0 pts)^Excelente</text><text x="479.172" y="204.857" fill="#000" font-size="12" textLength="59.725">Adecuado</text><text x="540.896" y="204.857" fill="#000" font-size="12" textLength="46.564">Regular</text><text x="589.461" y="204.857" fill="#000" font-size="12" textLength="71.244">Deficiente^</text><text x="7" y="220.826" fill="#000" font-size="12" textLength="185.074">Cobertura y Robustez de Tests</text><text x="197.924" y="220.826" fill="#000" font-size="12" textLength="26.672">40%</text><text x="284.264" y="220.826" fill="#000" font-size="12" textLength="192.908">^Excelente (3.5 pts)^Excelente</text><text x="479.172" y="220.826" fill="#000" font-size="12" textLength="59.725">Adecuado</text><text x="540.896" y="220.826" fill="#000" font-size="12" textLength="46.564">Regular</text><text x="589.461" y="220.826" fill="#000" font-size="12" textLength="71.244">Deficiente^</text><line x1="6" y1="230.156" x2="662.705" y2="230.156" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="245.795" fill="#000" font-size="12" textLength="385.301" font-weight="700">OBSERVACIONES CUALITATIVAS Y RETROALIMENTACIÓN:</text><text x="7" y="262.764" fill="#000" font-size="12" textLength="559.313">"Excelente trabajo en la refactorización, Carlos. La gestión de errores con TokenExpiredError</text><text x="7" y="278.732" fill="#000" font-size="12" textLength="592.389">quedó muy limpia y la cobertura de pruebas unitarias contempla todos los edge cases requeridos.</text><text x="7" y="294.701" fill="#000" font-size="12" textLength="459.627">El código cumple cabalmente con los estándares de producción del equipo."</text><line x1="6" y1="304.031" x2="662.705" y2="304.031" style="stroke:#AAA;stroke-width:1;"/><text x="27" y="320.67" fill="#000" font-size="12" textLength="353.426">Notificar inmediatamente al alumno por correo electrónico</text><rect x="9" y="311.516" width="10" height="10" fill="none" style="stroke:#000;stroke-width:1.5;"/><polygon points="10,315.531,13,318.531,20,309.531,13,316.531" fill="#000" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter