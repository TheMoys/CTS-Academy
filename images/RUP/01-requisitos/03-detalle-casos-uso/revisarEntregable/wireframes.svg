000" font-size="12" textLength="106.893" font-weight="700">Fecha de Envío:</text><text x="117.707" y="107.014" fill="#000" font-size="12" textLength="316.605">18/10/2026 15:42 (Re-entrega tras cambios previos)</text><text x="7" y="122.982" fill="#000" font-size="12" textLength="186.803" font-weight="700">Resultado Sandbox Docker:</text><text x="193.803" y="122.982" fill="#000" font-size="12"> </text><text x="197.617" y="122.982" fill="#008000" font-size="12" textLength="404.713" font-weight="700">TODOS LOS TESTS APROBADOS (12/12) — Cobertura: 94.2%</text><line x1="6" y1="132.313" x2="722.406" y2="132.313" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="147.951" fill="#000" font-size="12" textLength="303.604" font-weight="700">NOTAS TÉCNICAS DEL ALUMNO EN EL ENVÍO:</text><text x="7" y="164.92" fill="#000" font-size="12" textLength="583.371">"He corregido el middleware verifyToken agregando captura de TokenExpiredError para retornar</text><text x="7" y="180.889" fill="#000" font-size="12" textLength="546.633">código 401 estructurado con mensaje descriptivo. Además añadí la suite de tests unitarios</text><text x="7" y="196.857" fill="#000" font-size="12" textLength="535.635">en Jest cubriendo casos de header faltante, formato Bearer incorrecto y firma no válida."</text><line x1="6" y1="206.188" x2="722.406" y2="206.188" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="221.826" fill="#000" font-size="12" textLength="461.871" font-weight="700">INFORME DEL PIPELINE DE PRUEBAS AUTOMATIZADAS (CI RUNNER):</text><text x="7" y="238.795" fill="#000" font-size="12" textLength="277.371">PASS tests/auth.middleware.spec.ts (12 tests)</text><text x="7" y="254.764" fill="#000" font-size="12" textLength="464.086">- PASS verifyToken con token válido inyecta user payload en Request (14ms)</text><text x="7" y="270.732" fill="#000" font-size="12" textLength="432.516">- PASS verifyToken con token expirado retorna 401 TokenExpired (8ms)</text><text x="7" y="286.701" fill="#000" font-size="12" textLength="483.352">- PASS verifyToken sin cabecera Authorization retorna 401 MissingHeader (5ms)</text><text x="7" y="302.67" fill="#000" font-size="12" textLength="174.68">Test Suites: 1 passed, 1 total</text><text x="492.352" y="302.67" fill="#000" font-size="12" textLength="155.49">Tests: 12 passed, 12 total</text><text x="649.842" y="302.67" fill="#000" font-size="12" textLength="70.564">Time: 2.14s</text><line x1="6" y1="312" x2="722.406" y2="312" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="327.639" fill="#000" font-size="12" textLength="199.348" font-weight="700">ACCIONES DEL TECH LEADER:</text><rect x="9.5" y="335.969" width="388" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="49.639" y="349.107" fill="#008000" font-size="12" textLength="307.723" font-weight="700">Aprobar Entregable (Emitir Calificación Final)</text><rect x="404.5" y="335.969" width="212" height="17.969" fill="#EEE" style="stroke:#000;stroke-width:2.5;" rx="5" ry="5"/><text x="424.561" y="349.107" fill="#FFA500" font-size="12" textLength="171.879" font-weight="700">Solicitar Nuevos Cambios</text><?plantuml-src ZLNRRjj647ttLmnIj920K1T2AHB1DKBJTAn2eWIITj4QUHYI8taJaglkBfKeRO2-zg5FxG_a0_9Gv1Fq9_sIpfAgfQ06MW82BpDxTkQSiwFdsg0o6Wi3RuIYfSAIzCbF9y3NQNhc9p5uldSHpBw7ltxv0wBWPX9FTh-7aEn-zSE9xy55046OHC4BxtmQGCUVymUR5dpNFUsdPmtIDtpz0-aLTLd9iOs1ZwgG6cPKvV8TGYGsgE5dcpNRVShhOfys6xXZc68A0nSSy6fp1pEHvmMzGKNm5IIaZLrt2pUos902X0BX7AkSNY6yR7PsdERMThOl9QArrC989IGSbxKIvgvEUvai-vdH3cQOKxbrjAbpgepkPqtPJjcMxHIO3jnZt4LT513HZpNNrIBUmYA2BuOZBdz9Q6f5VUGsdFA-3MVZGiTBbL105RmGvgfEmJdhxilV8rzITeUG4mJLPlTnN-xmQNyuwBi3zsiOFXcF62SYXmjLj48mYYdDi4m54xrMjE5xztCIT5qOp2N4J5WgtyA5p5wJQh5FCrb8DLufekgCivFvnJo6AV-I8BRcM4JpSyz-wmpT_j3jDZRnPKgAkyGnF1lrt2yjr6c_WMeDyVvO4uODvuaNttigPbDDmPjUpy8vcmlu9GXlTh_Dn_UEEkZuw8eWaugR5Tm35N3W5DWBOhbDv6kc55UM3rQCsLZRsYoDJIXuksRhvu5IKi4QEQA8JL6XkjyaOpkAbOJHO0WiggepYs2nP0Ni0uslYF5qfiJQY8tiWSUMsNtGWBi_CTzzj8RKjJ0s2qpZrxeIVFPOZljTkCflEGHPpJwWjbJDil6I