<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:1266px;height:380px;background:#FFFFFF;" width="1266px" height="380px" viewBox="0 0 1266 380" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="6" y="17.139" fill="#000" font-size="12" textLength="476.707" font-weight="700">CTS ACADEMY — CREAR PREGUNTA TÉCNICA (BANCO DE EVALUACIÓN)</text><line x1="6" y1="24.469" x2="1097.129" y2="24.469" style="stroke:#AAA;stroke-width:1;"/><line x1="6" y1="26.469" x2="1097.129" y2="26.469" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="41.107" fill="#000" font-size="12" textLength="51.076" font-weight="700">Equipo:</text><text x="60.891" y="41.107" fill="#000" font-size="12" textLength="223.518">Equipo 01 — Backend &amp; Arquitectura</text><text x="1098.129" y="41.107" fill="#000" font-size="12" textLength="87.486" font-weight="700">Tech Leader:</text><text x="1189.43" y="41.107" fill="#000" font-size="12" textLength="69.779">Diego Moys</text><line x1="6" y1="49.438" x2="1097.129" y2="49.438" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="66.076" fill="#000" font-size="12" textLength="121.377" font-weight="700">Tipo de Pregunta:</text><text x="196.807" y="66.076" fill="#000" font-size="12" textLength="351.094">Teórica / Opción Múltiple (MCQ)  ( ) Reto Práctico Sandbox</text><ellipse cx="183.807" cy="61.922" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><ellipse cx="183.807" cy="61.922" rx="2" ry="2" fill="#000" style="stroke:#000;stroke-width:1.5;"/><text x="7" y="82.045" fill="#000" font-size="12" textLength="126.023" font-weight="700">Categoría Técnica:</text><text x="176.807" y="82.045" fill="#000" font-size="12" textLength="445.523">^Arquitectura Hexagonal &amp; Patrones^Arquitectura Hexagonal &amp; Patrones</text><text x="624.33" y="82.045" fill="#000" font-size="12" textLength="164.531">APIs REST &amp; Seguridad JWT</text><text x="790.861" y="82.045" fill="#000" font-size="12" textLength="138.158">Persistencia Relacional</text><text x="931.02" y="82.045" fill="#000" font-size="12" textLength="164.109">Event-Driven &amp; RabbitMQ^</text><text x="7" y="98.014" fill="#000" font-size="12" textLength="129.715" font-weight="700">Nivel de Dificultad:</text><text x="176.807" y="98.014" fill="#000" font-size="12" textLength="124.752">^Intermedio^Básico</text><text x="624.33" y="98.014" fill="#000" font-size="12" textLength="65.531">Intermedio</text><text x="790.861" y="98.014" fill="#000" font-size="12" textLength="68.936">Avanzado^</text><text x="7" y="113.982" fill="#000" font-size="12" textLength="125.73" font-weight="700">Puntos Asignados:</text><text x="179.807" y="113.982" fill="#000" font-size="12" textLength="19.084">1.0</text><line x1="177.807" y1="116.813" x2="204.807" y2="116.813" style="stroke:#000;stroke-width:1;"/><line x1="177.807" y1="113.813" x2="177.807" y2="115.813" style="stroke:#000;stroke-width:1;"/><line x1="204.807" y1="113.813" x2="204.807" y2="115.813" style="stroke:#000;stroke-width:1;"/><text x="7" y="131.951" fill="#000" font-size="12" textLength="167.807" font-weight="700">Tiempo Límite Estimado:</text><text x="176.807" y="131.951" fill="#000" font-size="12" textLength="95.432">"120" segundos</text><line x1="6" y1="141.281" x2="1097.129" y2="141.281" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="156.92" fill="#000" font-size="12" textLength="206.514" font-weight="700">ENUNCIADO DE LA PREGUNTA:</text><text x="7" y="173.889" fill="#000" font-size="12" textLength="542.965">"En una arquitectura hexagonal o de puertos y adaptadores implementada en TypeScript,</text><text x="7" y="189.857" fill="#000" font-size="12" textLength="562.26">¿dónde deben residir las interfaces que definen los contratos para los repositorios de datos?"</text><line x1="6" y1="199.188" x2="1097.129" y2="199.188" style="stroke:#AAA;stroke-width:1;"/><text x="6" y="214.826" fill="#000" font-size="12" textLength="179.596" font-weight="700">OPCIONES DE RESPUESTA:</text><text x="7" y="231.795" fill="#000" font-size="12" textLength="57.973" font-weight="700">Correcta</text><text x="66.973" y="231.795" fill="#000" font-size="12" textLength="222.176" font-weight="700">Texto de la Opción de Respuesta</text><line x1="7" y1="240.125" x2="65.973" y2="240.125" style="stroke:#AAA;stroke-width:1;"/><text x="27" y="255.764" fill="#000" font-size="12"> </text><ellipse cx="14" cy="251.609" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><ellipse cx="14" cy="251.609" rx="2" ry="2" fill="#000" style="stroke:#000;stroke-width:1.5;"/><text x="66.973" y="255.764" fill="#000" font-size="12" textLength="539.707">En la capa de Dominio o Aplicación (Core), independientes de la infraestructura concreta.</text><text x="27" y="271.732" fill="#000" font-size="12"> </text><ellipse cx="14" cy="267.578" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="66.973" y="271.732" fill="#000" font-size="12" textLength="520.594">En la capa de Infraestructura, junto a la implementación del ORM (TypeORM / Prisma).</text><text x="27" y="287.701" fill="#000" font-size="12"> </text><ellipse cx="14" cy="283.547" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="66.973" y="287.701" fill="#000" font-size="12" textLength="503.432">En la capa de Presentación o Controladores REST para facilitar la serialización DTO.</text><text x="27" y="303.67" fill="#000" font-size="12"> </text><ellipse cx="14" cy="299.516" rx="5" ry="5" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="66.973" y="303.67" fill="#000" font-size="12" textLength="399.252">En un paquete externo compartido entre múltiples microservicios.</text><line x1="6" y1="313" x2="1097.129" y2="313" style="stroke:#AAA;stroke-width:1;"/><rect x="8.5" y="320" width="180" height="17.969" fill="#EEE" style=