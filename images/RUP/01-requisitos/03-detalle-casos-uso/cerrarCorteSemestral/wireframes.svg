#000"/><text x="19" y="121.982" fill="#000" font-size="12" textLength="234.006" font-weight="700">Admitidos como Alumnos PROFER:</text><text x="253.006" y="121.982" fill="#000" font-size="12"> </text><text x="256.82" y="121.982" fill="#008000" font-size="12" textLength="78.234" font-weight="700">20 becarios</text><text x="338.869" y="121.982" fill="#000" font-size="12" textLength="186.334">(Ocupación del 95% de plazas)</text><ellipse cx="12.5" cy="133.281" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="137.951" fill="#000" font-size="12" textLength="189.891" font-weight="700">Candidaturas No Admitidas:</text><text x="208.891" y="137.951" fill="#000" font-size="12" textLength="19.072">     </text><text x="227.963" y="137.951" fill="#F00" font-size="12" textLength="92.396" font-weight="700">28 aspirantes</text><text x="324.174" y="137.951" fill="#000" font-size="12" textLength="229.529">(Notificaciones oficiales despachadas)</text><ellipse cx="12.5" cy="149.25" rx="2.5" ry="2.5" fill="#000"/><text x="19" y="153.92" fill="#000" font-size="12" textLength="242.297" font-weight="700">Expedientes Incompletos / Sin Test:</text><text x="261.297" y="153.92" fill="#000" font-size="12"> </text><text x="265.111" y="153.92" fill="#FFA500" font-size="12" textLength="84.047" font-weight="700">4 aspirantes</text><text x="352.973" y="153.92" fill="#000" font-size="12" textLength="200.918">(Serán archivados por abandono)</text><line x1="7" y1="162.25" x2="554.891" y2="162.25" style="stroke:#AAA;stroke-width:1;"/><text x="7" y="177.889" fill="#000" font-size="12" textLength="314.83" font-weight="700">Distribución Final de Alumnos por Equipo CTS:</text><text x="7" y="193.857" fill="#000" font-size="12" textLength="144.926">Team 01 (Backend): 4/4</text><text x="555.891" y="193.857" fill="#000" font-size="12" textLength="147.281">Team 02 (Frontend): 4/4</text><text x="705.172" y="193.857" fill="#000" font-size="12" textLength="140.227">Team 03 (DevOps): 4/4</text><text x="847.398" y="193.